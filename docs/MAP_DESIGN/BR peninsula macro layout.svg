  <title id="title">Península BR — zonas e primeira rede de estradas</title>
  <desc id="desc">Mapa conceitual visto de cima: cadeia de montanhas ao norte, zona militar a oeste, cidade central, indústria a leste, porto sudeste, dunas e praia ao sul, conectados por estradas de asfalto sinuosas.</desc>
