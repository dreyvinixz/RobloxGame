name: Pixel-first wireframe extraction validation
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/ai-island-inverse-terrain
    paths:
      - 'tools/terrain_inverse/extract_wireframe.py'
      - 'tools/terrain_inverse/requirements.txt'
      - 'tests/test_wireframe_pixels.py'
      - '.github/workflows/terrain-wireframe-pixels.yml'
  pull_request:
    paths:
      - 'tools/terrain_inverse/extract_wireframe.py'
      - 'tools/terrain_inverse/requirements.txt'
      - 'tests/test_wireframe_pixels.py'
      - '.github/workflows/terrain-wireframe-pixels.yml'
permissions:
  contents: read
jobs:
  pixel-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/terrain_inverse/requirements.txt
      - run: python -m pip install -r tools/terrain_inverse/requirements.txt
      - name: Pixel extractor tests (SYNTHETIC fixtures, not actual source)
        run: python -m unittest discover -s tests -p 'test_wireframe_pixels.py' -v
      - name: Build example pixel-detection diagnostics from a synthetic image
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from pathlib import Path
          raster=np.full((160,160,3),220,np.uint8)
          cv2.polylines(raster,[np.array([[20,20],[55,20],[36,52]])],True,(90,90,90),1)
          cv2.polylines(raster,[np.array([[90,90],[118,90],[118,116],[90,116]])],True,(90,90,90),1)
          Path('synthetic-source.png').write_bytes(cv2.imencode('.png',raster)[1].tobytes())
          PY
          python -m tools.terrain_inverse.extract_wireframe --image synthetic-source.png --output pixel-wireframe-synthetic
      - name: Upload reproducible SYNTHETIC test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pixel-wireframe-synthetic-${{ github.run_id }}
          path: |
            pixel-wireframe-synthetic/
          retention-days: 14
