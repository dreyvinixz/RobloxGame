name: Terrain 2 V3 multiview and hydrology
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/terrain-2-image-v3-v4
    paths:
      - tools/terrain_2_v3/**
      - tests/test_terrain2_v3.py
      - .github/workflows/terrain-2-v3.yml
  pull_request:
    paths:
      - tools/terrain_2_v3/**
      - tests/test_terrain2_v3.py
      - .github/workflows/terrain-2-v3.yml
permissions:
  contents: read
jobs:
  validate-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/terrain_inverse/requirements.txt
      - name: Install scientific Python
        run: python -m pip install -r tools/terrain_inverse/requirements.txt
      - name: Test V3 source, orthographic, isometric and river invariants
        run: python -m unittest discover -s tests -p 'test_terrain2_v3.py' -v
      - name: Verify required V3 original-source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path('tools/terrain_2_v3/terrain_v3.py').is_file()
          assert Path('tools/terrain_2_v3/river_v3.py').is_file()
          assert Path('tools/terrain_2_v3/isometric_v3.py').is_file()
          assert not Path('references/top_flat_semantic.jpg').exists()
          print('V3 CI validates synthetic input invariants; real source rasters are not in GitHub.')
          PY
