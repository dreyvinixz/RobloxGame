name: Terrain 2 V2 image constraints
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/terrain-2-image-v2
    paths:
      - tools/terrain_2_v2/**
      - tests/test_terrain2_v2.py
      - .github/workflows/terrain-2-v2.yml
  pull_request:
    paths:
      - tools/terrain_2_v2/**
      - tests/test_terrain2_v2.py
      - .github/workflows/terrain-2-v2.yml
permissions:
  contents: read
jobs:
  geometry-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/terrain_inverse/requirements.txt
      - run: python -m pip install -r tools/terrain_inverse/requirements.txt
      - name: Test original image dependence, river connectivity, mountain likelihood and cardinal profiles
        run: python -m unittest discover -s tests -p 'test_terrain2_v2.py' -v
      - name: Distinguish synthetic CI tests from actual original images
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path('references/top_flat_semantic.jpg').exists(), 'Source imagery should be explicit, not assumed'
          assert Path('tools/terrain_2_v2/reconstruct_v2.py').is_file()
          print('CI tests are deterministic synthetic fixtures only; see V2 README for real-input reproduction.')
          PY
